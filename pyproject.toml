[project]
name = "counter-os"
version = "0.1.0"
description = "An enterprise-grade counter application"
readme = "README.md"
authors = [
    { name = "Derick Downey", email = "126332037+derickdowney@users.noreply.github.com" }
]
requires-python = ">=3.15"
dependencies = [
    "click>=8.5.1",
    "dotenv>=0.9.9",
    "fastapi>=0.162.7",
    "flask>=3.1.3",
    "psycopg[binary]>=3.3.9",
    "pytest>=9.2.0",
    "pytest-random-order>=1.2.0",
    "pytest-xdist>=3.8.0",
    "sqlalchemy>=2.1.9",
    "testcontainers[postgres]>=4.15.0",
]

[project.scripts]
counter-os = "counter_os.main:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: tests requiring a running external service such as PostgreSQL",
]
