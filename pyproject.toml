[project]
name = "counter-os"
version = "0.1.0"
description = "An enterprise-grade counter application"
readme = "README.md"
authors = [
    { name = "Derick Downey", email = "126332037+derickdowney@users.noreply.github.com" }
]
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.162.7",
    "flask>=3.1.3",
    "pytest>=9.2.0",
    "pytest-random-order>=1.2.0",
    "pytest-xdist>=3.8.0",
    "typer>=0.29.1",
]

[project.scripts]
counter-os = "counter_os:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# addopts = "--random-order -n auto"
addopts = "--random-order"
